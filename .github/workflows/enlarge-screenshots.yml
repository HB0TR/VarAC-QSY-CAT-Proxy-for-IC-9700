name: Enlarge README screenshots

on:
  push:
    paths:
      - ".github/workflows/enlarge-screenshots.yml"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show screenshots full width and make them clickable
        shell: python
        run: |
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "![VarAC Application Launcher configuration](docs/images/application-launcher.png)",
              '<a href="docs/images/application-launcher.png"><img src="docs/images/application-launcher.png" alt="VarAC Application Launcher configuration" width="100%"></a>\n\n*Click the screenshot to open the image directly.*'
          )
          s = s.replace(
              "![VarAC RIG Control configuration for the IC-9700 proxy](docs/images/varac-rig-control.png)",
              '<a href="docs/images/varac-rig-control.png"><img src="docs/images/varac-rig-control.png" alt="VarAC RIG Control configuration for the IC-9700 proxy" width="100%"></a>\n\n*Click the screenshot to open the image directly.*'
          )
          p.write_text(s, encoding="utf-8")

      - name: Commit README improvement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Improve screenshot readability in README"
            git push origin HEAD:main
          fi

      - name: Remove temporary image branch
        shell: bash
        run: |
          git push origin --delete image-upgrade-assets || true

      - name: Remove one-time helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/enlarge-screenshots.yml
          git commit -m "Clean up screenshot update helper"
          git push origin HEAD:main
