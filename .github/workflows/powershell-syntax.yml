name: PowerShell syntax check

on:
  push:
    paths:
      - "**/*.ps1"
      - ".github/workflows/powershell-syntax.yml"
  pull_request:
    paths:
      - "**/*.ps1"
      - ".github/workflows/powershell-syntax.yml"

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell source without executing it
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter '*.ps1' -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              Write-Host "Syntax errors in $($_.FullName)"
              $errors | Format-List | Out-String | Write-Error
              $failed = $true
            } else {
              Write-Host "PowerShell syntax OK: $($_.FullName)"
            }
          }

          if ($failed) {
            exit 1
          }
