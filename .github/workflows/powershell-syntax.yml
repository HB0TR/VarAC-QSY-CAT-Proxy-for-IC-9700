name: PowerShell syntax check

on:
  push:
    paths:
      - "**/*.ps1"
      - ".github/workflows/powershell-syntax.yml"
  pull_request:
    paths:
      - "**/*.ps1"
      - ".github/workflows/powershell-syntax.yml"

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell source without executing it
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter '*.ps1' -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              Write-Host "Syntax errors in $($_.FullName)"
              $errors | Format-List | Out-String | Write-Error
              $failed = $true
            } else {
              Write-Host "PowerShell syntax OK: $($_.FullName)"
            }
          }

          if ($failed) {
            exit 1
          }

      - name: Compile embedded C# proxy
        shell: powershell
        run: |
          $text = Get-Content -LiteralPath ".\VarAC_QSY-CAT_Proxy_IC-9700_HB0TR.ps1" -Raw
          $startMarker = "`$source = @'"
          $start = $text.IndexOf($startMarker)
          if ($start -lt 0) {
            throw "Embedded C# source start marker was not found."
          }

          $bodyStart = $text.IndexOf("`n", $start)
          if ($bodyStart -lt 0) {
            throw "Embedded C# source body start was not found."
          }
          $bodyStart++

          $end = $text.IndexOf("`n'@", $bodyStart)
          if ($end -lt 0) {
            throw "Embedded C# source end marker was not found."
          }

          $csharp = $text.Substring($bodyStart, $end - $bodyStart)
          Add-Type -TypeDefinition $csharp -Language CSharp -ReferencedAssemblies "System.dll"
          Write-Host "Embedded C# compile OK."
