name: Publish V5.00 release

on:
  push:
    paths:
      - ".github/workflows/publish-v5.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct documentation screenshots
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release-assets-v5-final4
          mkdir -p docs/images

          for n in 01 02 03 04 05; do
            git show "origin/release-assets-v5-final4:.release-assets/app_chunk_${n}.txt"
          done | tr -d '\n\r ' | base64 -d > docs/images/application-launcher.png

          for f in rig_chunk_01.txt rig_chunk_03a.txt rig_chunk_03b.txt rig_chunk_04.txt; do
            git show "origin/release-assets-v5-final4:.release-assets/${f}"
          done | tr -d '\n\r ' | base64 -d > docs/images/varac-rig-control.png

          file docs/images/application-launcher.png
          file docs/images/varac-rig-control.png
          test "$(head -c 8 docs/images/application-launcher.png | xxd -p)" = "89504e470d0a1a0a"
          test "$(head -c 8 docs/images/varac-rig-control.png | xxd -p)" = "89504e470d0a1a0a"

      - name: Commit screenshots to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/application-launcher.png docs/images/varac-rig-control.png
          if ! git diff --cached --quiet; then
            git commit -m "Add VarAC configuration screenshots"
            git push origin HEAD:main
          fi

      - name: Build Windows V5.00 release package
        shell: bash
        run: |
          set -euo pipefail
          PKG="VarAC_QSY-CAT_Proxy_IC-9700_HB0TR_V5.00"
          rm -rf release dist
          mkdir -p "release/$PKG/docs/images" dist

          cp VarAC_QSY-CAT_Proxy_IC-9700_HB0TR.ps1 "release/$PKG/"
          cp Start_VarAC_QSY-CAT_Proxy.bat "release/$PKG/"
          cp proxy_config.ini README.md LICENSE NOTICE CHANGELOG.md "release/$PKG/"
          cp docs/ARCHITECTURE.md docs/TROUBLESHOOTING.md "release/$PKG/docs/"
          cp docs/images/application-launcher.png docs/images/varac-rig-control.png "release/$PKG/docs/images/"

          (cd release && zip -r "../dist/${PKG}_Windows.zip" "$PKG")
          (cd dist && sha256sum "${PKG}_Windows.zip" > SHA256SUMS.txt)

      - name: Create GitHub release and tag v5.00
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          # VarAC QSY-CAT Proxy for IC-9700 by HBØTR V5.00

          Initial public V5.00 release for VarAC + VARA SAT + Icom IC-9700 QO-100 operation.

          **Author:** HBØTR Stefan Franz | https://www.qrz.com/db/HB0TR

          ## Highlights
          - CAT/QSY frequency control from VarAC via TCP `127.0.0.1:9701`.
          - Separate Hamlib-compatible PTT endpoint on `localhost:4532`.
          - IC-9700 RX/MAIN and TX/SUB IF frequencies coordinated with a fixed 289.500 MHz delta.
          - Tested mapping: RX 433.595 MHz / TX 144.095 MHz.
          - IC-9700 must be in normal VFO mode; SATELLITE mode must be OFF.
          - VarAC `Diff Hz`: `-10056000000`.
          - English documentation and VarAC configuration screenshots included.

          Please read the README and safety notes before the first transmit test.
          EOF

          ZIP="dist/VarAC_QSY-CAT_Proxy_IC-9700_HB0TR_V5.00_Windows.zip"
          if gh release view v5.00 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v5.00 "$ZIP" dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v5.00 "$ZIP" dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "VarAC QSY-CAT Proxy for IC-9700 by HBØTR V5.00" \
              --notes-file /tmp/release-notes.md
          fi

      - name: Remove temporary branches
        if: success()
        shell: bash
        run: |
          set +e
          for b in \
            release-v5.00 docs-screenshots-v5 v5.00 \
            release-assets-v5 release-assets-v5-2 \
            release-assets-v5-final release-assets-v5-final2 \
            release-assets-v5-final3 release-assets-v5-final4 \
            test-marker-branch please-ignore-branch; do
            git push origin --delete "$b" 2>/dev/null || true
          done
