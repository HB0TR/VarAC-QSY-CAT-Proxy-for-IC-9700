name: Finalize JPG documentation screenshots

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/jpg-screenshot-update.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace old screenshots and clean up
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p docs/images
          mv -f "docs/images/Applications launcher.jpg" docs/images/application-launcher.jpg
          mv -f "docs/images/RIG-Settings.jpg" docs/images/varac-rig-control.jpg

          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('docs/images/application-launcher.png', 'docs/images/application-launcher.jpg')
          s = s.replace('docs/images/varac-rig-control.png', 'docs/images/varac-rig-control.jpg')
          p.write_text(s, encoding='utf-8')
          PY

          rm -f docs/images/application-launcher.png docs/images/varac-rig-control.png
          rm -rf .jpg-assets
          rm -f .github/workflows/jpg-screenshot-update.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use clearer JPG screenshots in documentation"
          git push origin HEAD:main
