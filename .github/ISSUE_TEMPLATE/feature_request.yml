name: Feature request
description: Suggest a new mapping, rig behavior, or usability improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: What station configuration or workflow needs this feature?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware / IF details
      description: Include transceiver, RX IF, TX IF, LO values and converter model if relevant.
