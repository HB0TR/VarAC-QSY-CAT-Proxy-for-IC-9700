# VarAC QSY-CAT Proxy for IC-9700 by HBØTR V5.00
# Author HBØTR Stefan Franz | https://www.qrz.com/db/HB0TR
#
# VarAC CAT/QSY listener
LISTEN_HOST=127.0.0.1
LISTEN_PORT=9701
#
# VarAC Hamlib-compatible PTT listener
HAMLIB_HOST=127.0.0.1
HAMLIB_PORT=4532
#
# Physical IC-9700 USB/CI-V serial port
RADIO_PORT=COM5
BAUD=115200
CIV_ADDRESS=A2
#
# Tested QO-100 IF mapping: RX/MAIN 433 MHz -> TX/SUB 144 MHz
RX_TX_DELTA_HZ=289500000
RX_IF_MIN_HZ=433000000
RX_IF_MAX_HZ=434000000
TX_IF_MIN_HZ=144000000
TX_IF_MAX_HZ=146000000
#
# Keep enabled for the tested IC-9700 normal VFO-mode setup (SATELLITE mode OFF).
IGNORE_VARAC_MODE_COMMANDS=1
LOG_FILE=QSY-CAT_Proxy.log
