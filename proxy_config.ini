# VarAC QSY-CAT Proxy for IC-9700 by HBØTR V5.01
# Author HBØTR Stefan Franz | https://www.qrz.com/db/HB0TR
#
# VarAC CAT/QSY listener
LISTEN_HOST=127.0.0.1
LISTEN_PORT=9701
#
# VarAC Hamlib-compatible PTT listener
HAMLIB_HOST=127.0.0.1
HAMLIB_PORT=4532
#
# Physical IC-9700 USB/CI-V serial port
RADIO_PORT=COM5
BAUD=115200
CIV_ADDRESS=A2
#
# Tested native SAT QO-100 IF mapping: D0/RX 433 MHz -> D1/TX 144 MHz
RX_TX_DELTA_HZ=289500000
#
# Defined QO-100 startup working frequency
# 1 = calculate and set the IC-9700 SAT IFs from the real QO-100 downlink RF
# 0 = retain the IC-9700's existing SAT frequencies
STARTUP_SET_FREQUENCIES=1
#
# Real QO-100 downlink RF in Hz.
# 10489595000 Hz = 10489.595 MHz
QO100_DL_RF_HZ=10489595000
#
# RX converter LO used to translate QO-100 downlink RF to the IC-9700 IF.
# 10489.595 MHz - 10056.000 MHz = 433.595 MHz
RX_CONVERTER_LO_HZ=10056000000
#
# Result with RX_TX_DELTA_HZ=289500000:
# D0/RX IF = 433595000 Hz = 433.595 MHz
# D1/TX IF = 144095000 Hz = 144.095 MHz
#
RX_IF_MIN_HZ=433000000
RX_IF_MAX_HZ=434000000
TX_IF_MIN_HZ=144000000
TX_IF_MAX_HZ=146000000
#
# Keep enabled: V5.01 initializes USB-D itself and intercepts VarAC 0x26 mode commands.
IGNORE_VARAC_MODE_COMMANDS=1
LOG_FILE=QSY-CAT_Proxy.log
